buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'com.mobidevelop.robovm:robovm-gradle-plugin:2.3.23'
    }
}

allprojects {
    apply plugin: 'eclipse'
    version = '1.0'
    ext {
        appName = 'LangLaLibgdx'
        gdxVersion = '1.12.1'
        roboVMVersion = '2.3.23'
    }
    repositories { mavenCentral() }
}

project(':core') {
    apply plugin: 'java-library'
    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    }
    // The desktop launcher uses Swing/LWJGL, which are unavailable on iOS.
    sourceSets.main.java.exclude 'com/beatdz/langlalau/**'
}

project(':ios') {
    apply plugin: 'java-library'
    apply plugin: 'robovm'
    dependencies {
        implementation project(':core')
        api "com.mobidevelop.robovm:robovm-rt:$roboVMVersion"
        api "com.mobidevelop.robovm:robovm-cocoatouch:$roboVMVersion"
        api "com.mobidevelop.robovm:robovm-objc:$roboVMVersion"
        api "com.badlogicgames.gdx:gdx-backend-robovm-metalangle:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-ios"
        api 'com.badlogicgames.gdx:gdx-jnigen-loader:2.3.1'
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-ios"
    }
    robovm {
        archs = 'arm64'
        iosSkipSigning = true
    }
}
